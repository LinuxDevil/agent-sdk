<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>loushy dev</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 0.75rem; min-height: 200px; margin-bottom: 1rem; white-space: pre-wrap; }
  .row { display: flex; gap: 0.5rem; }
  #msg { flex: 1; padding: 0.5rem; }
  button { padding: 0.5rem 1rem; }
  .entry { margin-bottom: 0.5rem; }
  .entry.user { font-weight: 600; }
  #status { border-radius: 8px; padding: 0.5rem 0.75rem; margin-bottom: 1rem; background: #fde8e8; color: #7a1b1b; white-space: pre-wrap; }
  #status[hidden] { display: none; }
</style>
</head>
<body>
  <h1>loushy dev</h1>
  <div id="status" hidden></div>
  <div id="log"></div>
  <div class="row">
    <input id="msg" type="text" placeholder="Say something..." autocomplete="off" />
    <button id="send">Send</button>
  </div>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('msg');
    const button = document.getElementById('send');

    function append(who, text) {
      const div = document.createElement('div');
      div.className = 'entry ' + who;
      div.textContent = (who === 'user' ? 'You: ' : 'Agent: ') + text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const message = input.value.trim();
      if (!message) return;
      append('user', message);
      input.value = '';
      button.disabled = true;
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        append('agent', data.text || data.error || '(no response)');
      } catch (err) {
        append('agent', 'Error: ' + err.message);
      } finally {
        button.disabled = false;
        input.focus();
      }
    }

    // Hot reload (LOU-D31): show the last failed reload; the previous agent keeps answering.
    const status = document.getElementById('status');
    async function refreshStatus() {
      try {
        const info = await (await fetch('/dev/status')).json();
        status.hidden = !info.error;
        status.textContent = info.error ? 'Last reload failed, still serving the previous agent:\n' + info.error : '';
      } catch (err) {
        status.hidden = true;
      }
    }
    refreshStatus();
    setInterval(refreshStatus, 2000);

    button.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
