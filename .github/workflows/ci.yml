name: CI
on:
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `undici` (a direct dependency, ^8.11.2 as of LOU-K3's Cloudflare
          # Worker LLM provider support) declares an engines requirement of
          # node >=22.19.0. Under Node 20, requiring it (indirectly, via
          # anything that touches its Cache/fetch internals) throws
          # `TypeError: webidl.util.markAsUncloneable is not a function`
          # instead of just an EBADENGINE warning - which was crashing
          # whichever vitest worker hit it first and cascading into "0 test"
          # failures across the rest of that worker's queue. Node 20 was
          # already below what a fresh dependency needs; bump to match.
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      # The test files are type-checked too (tsconfig.tests.json), so they cannot drift from the API.
      - run: npm run typecheck:tests
      # The examples are type-checked too (tsconfig.examples.json), so they cannot drift from the API.
      - run: npm run typecheck:examples
      - run: npm run lint
      # Build the root SDK's dist *before* running tests:
      # packages/create-lousho-agent/src/template.e2e.test.ts `npm pack`s the
      # root SDK's own source tree to install it into a generated project,
      # which needs dist/ (package.json's main/module/types) to already
      # exist - it was previously built only in the step after tests, so
      # this test always failed once it actually got a chance to run.
      - run: npm run build
        # The dual-entry build's DTS pass (worker + executor entries) exceeds
        # the default heap, like the peers job's build below.
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      # API surface gate (A7): every exports entry has a checked-in api/*.api.md
      # report; a public-API change fails here until `npm run api:update` is run
      # and the diff committed. Runs only in the main job so the report reflects
      # the default peers, not the `peers` matrix's ai/zod pairings.
      - run: npm run api:check
      # packages/create-lousho-agent's own tests execFileSync its bin/cli.js,
      # which requires ITS dist/index.js to exist too - build it before the
      # test step (this is a separate package from the root SDK above).
      - run: npm run build --workspace=packages/create-lousho-agent
      # Every ```ts block in README.md and docs/*.md must type-check against
      # src/ (quick-start also runs against the packed tarball). Needs dist/.
      - run: npm run docs:verify-snippets -- --skip-build
      # llms.txt / llms-full.txt are generated from README + docs; fail if stale.
      # Compile-time API tests (*.test-d.ts): inference of defineTool, flow types, fs adapter.
      - run: npm run test:types
      - run: npm run docs:llms:check
      # TypeDoc "not documented" count may only go down (Eve DUI-F18).
      - run: npm run docs:ratchet
      # registry/dist is generated from registry/; fail if stale (M7b).
      - run: npm run registry:check
      - run: npm run test:coverage
      # Agent Forge (apps/agent-forge) imports the SDK as
      # `@lousho/build-ai-agent` via `file:../..`, i.e. the root dist/ built
      # above, so these run after the root build. Its client and server
      # suites were never run in CI before, which is how a Stop-then-Run
      # resume regression (LOU-U10) landed unnoticed.
      - run: npm run typecheck --workspace apps/agent-forge
      - run: npm run typecheck:server --workspace apps/agent-forge
      - run: npm run test --workspace apps/agent-forge -- --run
      - run: npm run test:server --workspace apps/agent-forge
      # Dead code, duplication and complexity gate (config: .fallowrc.json).
      # Bare `fallow` fails on any finding. Runs after the coverage step because
      # its CRAP scores read coverage/coverage-final.json.
      - run: npm run fallow
  # LOU-M8: every `ai` and zod pairing the peer ranges accept, installed for real on top of the
  # default install (`npm ci`; `--no-save` leaves the lockfile alone). The default dev install is
  # `ai` 4 with zod 3 and runs in `ci`. `ollama-ai-provider-v2` peers on zod 4, so only the zod 4
  # entries install it; ollamaV2.contract.test.ts runs against the real package in those two.
  # `flags` for those two: ollama-ai-provider-v2 is an optional peer of this package, which npm does not
  # install by name unless `--save-prod` (in-memory only with --no-save) makes it a dependency, and the dev
  # install's ollama-ai-provider (v1, zod 3 peer) conflicts with zod 4, hence `--legacy-peer-deps`.
  # The v4-only tests are gated by itOnAiV4/describeOnAiV4 (LOU-D28b); Worker bundle tests run on all.
  peers:
    name: peers (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai4-zod4
            install: zod@4
            typecheck-tests: true
          - name: ai6-zod3
            install: ai@6 @ai-sdk/openai@3 @ai-sdk/anthropic@3
          - name: ai6-zod4
            install: ai@6 @ai-sdk/openai@3 @ai-sdk/anthropic@3 ollama-ai-provider-v2@3 zod@4
            flags: --save-prod --legacy-peer-deps
          - name: ai7-zod3
            install: ai@7 @ai-sdk/openai@4 @ai-sdk/anthropic@4
          - name: ai7-zod4
            install: ai@7 @ai-sdk/openai@4 @ai-sdk/anthropic@4 ollama-ai-provider-v2@4 zod@4
            flags: --save-prod --legacy-peer-deps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save ${{ matrix.flags }} ${{ matrix.install }}
      - run: npx tsc --noEmit
      # The tests are written against `ai` 4's types (v4-shaped Tool, MockLanguageModelV1), so they only
      # type-check there; ai4-zod4 is the zod 4 entry (it was the old typecheck-zod4 job).
      - run: npm run typecheck:tests
        if: matrix.typecheck-tests
      - run: npm run test:types
      # The DTS build of the ai7-zod4 install runs out of the default heap (seen on #322, #335).
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      - run: npm run build --workspace=packages/create-lousho-agent
      - run: npx vitest run
  # LOU-D49: what `npm pack` produces must install and work in a fresh project. The script
  # builds, packs the SDK and create-lousho-agent, runs `npm publish --dry-run` (never a real
  # publish), installs the tarballs plus peers from the registry, and loads every export in
  # ESM and CJS, runs a mock-model turn, the lousho bin and tsc (bundler and node16).
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run pack-smoke
        # pack-smoke runs `npm run build` itself, which needs the same heap.
        env:
          NODE_OPTIONS: --max-old-space-size=12288
