name: CI
on:
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `undici` (a direct dependency, ^8.11.2 as of LOU-K3's Cloudflare
          # Worker LLM provider support) declares an engines requirement of
          # node >=22.19.0. Under Node 20, requiring it (indirectly, via
          # anything that touches its Cache/fetch internals) throws
          # `TypeError: webidl.util.markAsUncloneable is not a function`
          # instead of just an EBADENGINE warning - which was crashing
          # whichever vitest worker hit it first and cascading into "0 test"
          # failures across the rest of that worker's queue. Node 20 was
          # already below what a fresh dependency needs; bump to match.
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Build the root SDK's dist *before* running tests:
      # packages/create-loushy-agent/src/template.e2e.test.ts `npm pack`s the
      # root SDK's own source tree to install it into a generated project,
      # which needs dist/ (package.json's main/module/types) to already
      # exist - it was previously built only in the step after tests, so
      # this test always failed once it actually got a chance to run.
      - run: npm run build
      # packages/create-loushy-agent's own tests execFileSync its bin/cli.js,
      # which requires ITS dist/index.js to exist too - build it before the
      # test step (this is a separate package from the root SDK above).
      - run: npm run build --workspace=packages/create-loushy-agent
      # Every ```ts block in README.md and docs/*.md must type-check against
      # src/ (quick-start also runs against the packed tarball). Needs dist/.
      - run: npm run docs:verify-snippets -- --skip-build
      # llms.txt / llms-full.txt are generated from README + docs; fail if stale.
      # Compile-time API tests (*.test-d.ts): inference of defineTool, flow types, fs adapter.
      - run: npm run test:types
      - run: npm run docs:llms:check
      - run: npm run test:coverage
      # Agent Forge (apps/agent-forge) imports the SDK as
      # `@loushy/build-ai-agent` via `file:../..`, i.e. the root dist/ built
      # above, so these run after the root build. Its client and server
      # suites were never run in CI before, which is how a Stop-then-Run
      # resume regression (LOU-U10) landed unnoticed.
      - run: npm run typecheck --workspace apps/agent-forge
      - run: npm run typecheck:server --workspace apps/agent-forge
      - run: npm run test --workspace apps/agent-forge -- --run
      - run: npm run test:server --workspace apps/agent-forge
      # Dead code, duplication and complexity gate (config: .fallowrc.json).
      # Bare `fallow` fails on any finding. Runs after the coverage step because
      # its CRAP scores read coverage/coverage-final.json.
      - run: npm run fallow
  # LOU-D28a: the SDK source must also type-check against `ai` v7 and its
  # matching `@ai-sdk/*` majors (the peers still name v4; LOU-D28d widens them).
  typecheck-ai7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save ai@7 @ai-sdk/openai@4 @ai-sdk/anthropic@4
      - run: npx tsc --noEmit
      # LOU-D28b: the suite runs on ai v7 too. The v4-only tests are gated by the shared
      # describeOnAiV4/itOnAiV4 helpers; the Worker bundle tests run on both (LOU-D28c).
      - run: npm run build
      - run: npm run build --workspace=packages/create-loushy-agent
      - run: npx vitest run
