name: CI
on:
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # packages/create-loushy-agent's own tests execFileSync its bin/cli.js,
      # which requires its dist/index.js to exist - build it before the test
      # step (not just the root SDK, which `npm run build` below handles).
      - run: npm run build --workspace=packages/create-loushy-agent
      - run: npm run test:coverage
      - run: npm run build
