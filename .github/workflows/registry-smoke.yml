name: Registry smoke
# Tests the packages as published on npm (not the checkout's build): scaffold with
# `npm create lousho-agent`, the project's own tests, every export in ESM and CJS,
# `lousho doctor`, and `lousho studio`. No secrets: the --live step is never run here.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version or dist-tag to test (default: latest)'
        required: false
        default: 'latest'
jobs:
  registry-smoke:
    name: registry-smoke (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['22.19.0', '26']
        include:
          - os: windows-latest
            node-version: '22.19.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run registry-smoke -- --version "${{ inputs.version || 'latest' }}"
        shell: bash
